<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
</head>
<script src="script.js"> Javascript</script>
<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  
  min-height: 100vh;
  display:flex;
  align-items: center;
  justify-content: center;
  /*background: linear-gradient(135deg, #3e5ce3, #933de9);*/
  background: url("imgg.jpg") ;
  font-family: "Segoe UI", Arial, sans-serif;
}

.post h1{
  text-align: center;
  color: rgb(59, 82, 101);
}

.post {
  width: 100%;
  max-width: 360px;
  padding: 32px 28px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(23, 22, 22, 0.2);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.post input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #4242f0;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.post input[type="text"]:focus {
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
}

.post label {
  font-size: 13px;
  color: #666;
}

.post a {
  align-self: flex-end;
  font-size: 13px;
  color: #667eea;
  text-decoration: none;
}

.post a:hover {
  text-decoration:underline;
}

.post button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #0c30cf;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

.post button:hover {
  background: #5568d3;
}
p{
  font-size: 14px;
  text-align: center;
  color: #47517c;
}

.post button:active {
  transform: scale(0.98);
}
</style>
<body>

<form class="post">
   <h1> Login</h1>
    <input type="text" id="text" placeholder="Enter your nickname" autofocus>
    <label type="text" id="text"></label>
<div>

 <input type="text" id="password" placeholder="Enter password" autofocus>
    <label type="password" id="password"></label>
</div>
   

   <a href="password">forget password!</a>
    <button>Login</button>

    <p> Don't have an account? <a href="password">Register</a></p>
</form>

   

</body>
</html>
